[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-digital-trust-platform"
version = "1.0.0"
description = "Enterprise Digital Identity, Trust & Deepfake Detection Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "scipy>=1.14.0",
    "opencv-python-headless>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
