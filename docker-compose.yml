version: '3.8'

services:
  # Enterprise Core Application Gateway & Micro-Engines
  trust-core-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trust-core-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - POSTGRES_URL=postgresql://trust_admin:trust_secure_pass_2026@postgres:5432/trust_identity
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=trust_graph_password_2026
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - neo4j
      - redis
      - kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Relational Database for Users, Audit Trails & Verifications
  postgres:
    image: postgres:16-alpine
    container_name: trust-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=trust_identity
      - POSTGRES_USER=trust_admin
      - POSTGRES_PASSWORD=trust_secure_pass_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Identity Knowledge Graph Database (NetworkX to Neo4j Sync)
  neo4j:
    image: neo4j:5.20-community
    container_name: trust-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/trust_graph_password_2026
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4jdata:/data
    restart: unless-stopped

  # In-Memory Cache & Session State
  redis:
    image: redis:7-alpine
    container_name: trust-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # Event-Driven Streaming Bus (Zookeeper + Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: trust-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trust-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  redisdata:
